<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #151515;
    color: white;
    font-family: Arial, sans-serif;
}

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.background span,
.background img {
    position: absolute;
    left: var(--x);
    top: var(--y);
    font-size: var(--size);
    opacity: var(--opacity);
}

.background img {
    width: var(--size);
    height: var(--size);
    object-fit: contain;
}

.profile {
    position: relative;
    z-index: 2;
    text-align: center;
}

/* CUBE */

.cube-container {
    width: 90px;
    height: 90px;
    margin: 0 auto 45px;
    perspective: 600px;
}

.cube {
    width: 90px;
    height: 90px;
    position: relative;
    transform-style: preserve-3d;
    animation: spin 12s linear infinite;
}

@keyframes spin {
    from { transform: rotateX(-22deg) rotateY(0deg); }
    to { transform: rotateX(-22deg) rotateY(360deg); }
}

.face {
    position: absolute;
    inset: -0.5px;
    width: 91px;
    height: 91px;
    background: #fee25d;
}

.front {
    transform: translateZ(45.5px);
    background-image: url("https://github.com/snigglaberry/critsite/blob/main/chez/chezface.png?raw=true");
    background-size: cover;
    background-position: center;
}

.back {
    transform: rotateY(180deg) translateZ(45.5px);
    background: #fee25d;
}

.right {
    transform: rotateY(90deg) translateZ(45.5px);
    background: #d9bd4e;
}

.left {
    transform: rotateY(-90deg) translateZ(45.5px);
    background: #e5cc55;
}

.top {
    transform: rotateX(90deg) translateZ(45.5px);
    background: #fee25d;
}

.bottom {
    transform: rotateX(-90deg) translateZ(45.5px);
    background: #bba23f;
}

/* TEXT */

h1 {
    font-size: 30px;
    margin-bottom: 12px;
}

.bio {
    color: #999;
    font-size: 14px;
    line-height: 1.8;
}

.links {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 25px;
}

.links a {
    color: #999;
    text-decoration: none;
    font-size: 13px;
    transition: color .2s;
}

.links a:hover {
    color: #fee25d;
}

.discord {
    position: relative;
}

.discord::after {
    content: "im.chez";
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #252525;
    color: white;
    padding: 5px 9px;
    border-radius: 4px;
    font-size: 11px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    white-space: nowrap;
}

.discord:hover::after {
    opacity: 1;
}
</style>
</head>
