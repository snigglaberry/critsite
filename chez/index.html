
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chez</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    position: relative;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: -30px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 35px;
    padding: 35px;
    filter: blur(3px);
    opacity: 0.13;
    transform: rotate(-12deg) scale(1.1);
    pointer-events: none;
}

.background span {
    font-size: 34px;
    color: #fee25d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.background span:nth-child(even) {
    color: #fff;
    font-size: 25px;
}

.background span:nth-child(3n) {
    color: #aaa;
}

/* SOFT BACKGROUND BLUR */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 0%,
        rgba(17,17,17,0.3) 45%,
        #111 100%
    );
    pointer-events: none;
    z-index: 1;
}

/* PROFILE */

.profile {
    position: relative;
    z-index: 2;
    text-align: center;
}

/* CUBE */

.cube-container {
    width: 90px;
    height: 90px;
    margin: 0 auto 45px;
    perspective: 600px;
}

.cube {
    width: 90px;
    height: 90px;
    position: relative;
    transform-style: preserve-3d;
    animation: spin 12s linear infinite;
}

@keyframes spin {
    from {
        transform: rotateX(-22deg) rotateY(0deg);
    }
    to {
        transform: rotateX(-22deg) rotateY(360deg);
    }
}

.face {
    position: absolute;
    width: 91px;
    height: 91px;
    inset: -0.5px;
    background: #fee25d;
    backface-visibility: visible;
}

.front {
    transform: translateZ(45.5px);
    background-image: url("https://github.com/snigglaberry/critsite/blob/main/chez/chezface.png?raw=true");
    background-size: cover;
    background-position: center;
}

.back {
    transform: rotateY(180deg) translateZ(45.5px);
    background: #fee25d;
}

.right {
    transform: rotateY(90deg) translateZ(45.5px);
    background: #d9bd4e;
}

.left {
    transform: rotateY(-90deg) translateZ(45.5px);
    background: #e5cc55;
}

.top {
    transform: rotateX(90deg) translateZ(45.5px);
    background: #fee25d;
}

.bottom {
    transform: rotateX(-90deg) translateZ(45.5px);
    background: #bba23f;
}

/* TEXT */

h1 {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 12px;
}

.bio {
    color: #999;
    font-size: 14px;
    line-height: 1.8;
}

/* LINKS */

.links {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 25px;
}

.links a {
    color: #999;
    text-decoration: none;
    font-size: 13px;
    transition: color 0.2s;
}

.links a:hover {
    color: #fee25d;
}

/* DISCORD TOOLTIP */

.discord {
    position: relative;
}

.discord::after {
    content: "im.chez";
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #252525;
    color: white;
    padding: 5px 9px;
    border-radius: 4px;
    font-size: 11px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    white-space: nowrap;
}

.discord:hover::after {
    opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
    .cube {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="background" aria-hidden="true">
    <span>✦</span><span>+</span><span>◈</span><span>⌘</span>
    <span>✧</span><span>◇</span><span>+</span><span>✦</span>
    <span>⌘</span><span>✦</span><span>◈</span><span>+</span>

    <span>+</span><span>◈</span><span>✧</span><span>◇</span>
    <span>✦</span><span>⌘</span><span>+</span><span>◈</span>

    <span>◈</span><span>⌘</span><span>✧</span><span>✦</span>
    <span>◇</span><span>+</span><span>◈</span><span>✧</span>
    <span>✦</span><span>⌘</span><span>◇</span><span>+</span>
    <span>◈</span><span>✧</span><span>✦</span><span>⌘</span>
    <span>+</span><span>◇</span><span>✧</span><span>◈</span>
</div>

<main class="profile">

    <div class="cube-container">

            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

    <h1>chez</h1>

    <p class="bio">
        hi im chez i make stuff<br>
        ex roblox developer<br>
        owner of crit
    </p>

    <nav class="links">
        <a href="https://discord.com" class="discord" target="_blank" rel="noopener noreferrer">discord</a>

</body>
</html>
