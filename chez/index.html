
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090909;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .profile {
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .bio {
            color: #999;
            font-size: 14px;
            line-height: 1.7;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 24px;
        }

        .links a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }

        .links a:hover {
            color: #fff;
        }

        .discord {
            position: relative;
        }

        .discord::after {
            content: "im.chez";
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #202020;
            color: white;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 11px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .discord:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>

    <main class="profile">
        <img src="profile.png" alt="aura pfp tung tung sahur" class="avatar">

        <h1>chez</h1>

        <p class="bio">
            hi im chez i make stuff<br>
            ex roblox developer<br>
            owner of crit
        </p>

        <nav class="links">
            <a href="https://discord.com" class="discord" target="_blank">discord</a>
            <a href="https://namemc.com/profile/chezd" target="_blank">minecraft</a>
        </nav>
    </main>

</body>
</html>
