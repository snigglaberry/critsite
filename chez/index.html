
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chez</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #151515;
    color: white;
    font-family: Arial, sans-serif;
}

/* RANDOM BACKGROUND ICONS */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.background span {
    position: absolute;
    color: #777;
    font-size: var(--size);
    opacity: var(--opacity);
    left: var(--x);
    top: var(--y);
}

/* PROFILE */

.profile {
    position: relative;
    z-index: 2;
    text-align: center;
}

/* 3D CUBE */

.cube-container {
    width: 90px;
    height: 90px;
    margin: 0 auto 45px;
    perspective: 600px;
}

.cube {
    width: 90px;
    height: 90px;
    position: relative;
    transform-style: preserve-3d;
    animation: spin 12s linear infinite;
}

@keyframes spin {
    from { transform: rotateX(-22deg) rotateY(0deg); }
    to { transform: rotateX(-22deg) rotateY(360deg); }
}

.face {
    position: absolute;
    inset: -0.5px;
    width: 91px;
    height: 91px;
    background: #fee25d;
}

.front {
    transform: translateZ(45.5px);
    background-image: url("https://github.com/snigglaberry/critsite/blob/main/chez/chezface.png?raw=true");
    background-size: cover;
    background-position: center;
}

.back {
    transform: rotateY(180deg) translateZ(45.5px);
    background: #fee25d;
}

.right {
    transform: rotateY(90deg) translateZ(45.5px);
    background: #d9bd4e;
}

.left {
    transform: rotateY(-90deg) translateZ(45.5px);
    background: #e5cc55;
}

.top {
    transform: rotateX(90deg) translateZ(45.5px);
    background: #fee25d;
}

.bottom {
    transform: rotateX(-90deg) translateZ(45.5px);
    background: #bba23f;
}

/* TEXT */

h1 {
    font-size: 30px;
    margin-bottom: 12px;
}

.bio {
    color: #999;
    font-size: 14px;
    line-height: 1.8;
}

/* LINKS */

.links {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 25px;
}

.links a {
    color: #999;
    text-decoration: none;
    font-size: 13px;
    transition: color .2s;
}

.links a:hover {
    color: #fee25d;
}

.discord {
    position: relative;
}

.discord::after {
    content: "im.chez";
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #252525;
    color: white;
    padding: 5px 9px;
    border-radius: 4px;
    font-size: 11px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    white-space: nowrap;
}

.discord:hover::after {
    opacity: 1;
}
</style>
</head>

<body>

<div class="background" aria-hidden="true">
    <span style="--x:5%;--y:8%;--size:28px;--opacity:.35">✦</span>
    <span style="--x:17%;--y:23%;--size:35px;--opacity:.2">◇</span>
    <span style="--x:29%;--y:9%;--size:22px;--opacity:.3">⌘</span>

    <span style="--x:89%;--y:12%;--size:30px;--opacity:.3">✦</span>

    <span style="--x:8%;--y:43%;--size:34px;--opacity:.2">⊹</span>
    <span style="--x:22%;--y:57%;--size:25px;--opacity:.3">✧</span>
    <span style="--x:37%;--y:42%;--size:38px;--opacity:.2">◈</span>
    <span style="--x:63%;--y:48%;--size:28px;--opacity:.3">◇</span>
    <span style="--x:78%;--y:57%;--size:34px;--opacity:.2">⌘</span>
    <span style="--x:94%;--y:43%;--size:25px;--opacity:.3">✦</span>

    <span style="--x:4%;--y:77%;--size:30px;--opacity:.3">+</span>
    <span style="--x:18%;--y:88%;--size:36px;--opacity:.2">◈</span>
    <span style="--x:33%;--y:76%;--size:24px;--opacity:.3">✦</span>
    <span style="--x:48%;--y:91%;--size:32px;--opacity:.2">◇</span>
    <span style="--x:66%;--y:81%;--size:26px;--opacity:.3">✧</span>
    <span style="--x:82%;--y:89%;--size:38px;--opacity:.2">⊹</span>
    <span style="--x:96%;--y:77%;--size:28px;--opacity:.3">⌘</span>
</div>

<main class="profile">

    <div class="cube-container">

            <div class="face front"></div>
            <div class="face back"></div>

        </div>

    <h1>chez</h1>

    <p class="bio">
        hi im chez i make stuff<br>
        ex roblox developer<br>
        owner of crit
    </p>

    <nav class="links">
        <a href="https://discord.com" class="discord" target="_blank" rel="noopener noreferrer">discord</a>
        <a href="https://namemc.com/profile/chezd" target="_blank" rel="noopener noreferrer">minecraft</a>
    </nav>

</body>
</html>
