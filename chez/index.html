<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#151515">
<title>chez</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: #111;
    color: #f3f3f3;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.background canvas {
    width: 100%;
    height: 100%;
    display: block;
    opacity: .78;
}

.profile {
    position: relative;
    z-index: 2;
    text-align: center;
    width: min(90vw, 360px);
}

.cube-wrap {
    width: 100px;
    height: 100px;
    margin: 0 auto 27px;
    perspective: 650px;
}

.cube {
    position: relative;
    width: 90px;
    height: 90px;
    margin: 5px;
    transform-style: preserve-3d;
    animation: spin 13s linear infinite;
}

.face {
    position: absolute;
    width: 91px;
    height: 91px;
    left: -.5px;
    top: -.5px;
    background: #fee25d;
    border: 1px solid rgba(0,0,0,.09);
    overflow: hidden;
}

.front {
    transform: translateZ(45.5px);
    background: #fee25d;
}

.front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.back {
    transform: rotateY(180deg) translateZ(45.5px);
    background: #eacb4c;
}

.right {
    transform: rotateY(90deg) translateZ(45.5px);
    background: #f6d650;
}

.left {
    transform: rotateY(-90deg) translateZ(45.5px);
    background: #dfbf42;
}

.top {
    transform: rotateX(90deg) translateZ(45.5px);
    background: #fff078;
}

.bottom {
    transform: rotateX(-90deg) translateZ(45.5px);
    background: #c9a936;
}

@keyframes spin {
    from {
        transform: rotateX(-18deg) rotateY(0);
    }
    to {
        transform: rotateX(-18deg) rotateY(360deg);
    }
}

h1 {
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -.7px;
    margin: 0 0 12px;
}

.bio {
    font-size: 14px;
    line-height: 1.85;
    color: #aaa;
    margin: 0;
}

.links {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 22px;
}

.links a {
    font-size: 13px;
    color: #eee;
    text-decoration: none;
    transition: color .18s;
}

.links a:hover {
    color: #fee25d;
}

.links a span {
    border-bottom: 1px solid #555;
    padding-bottom: 3px;
}

.links a:hover span {
    border-color: #fee25d;
}

.tooltip {
    position: relative;
}

.tooltip::after {
    content: attr(data-tip);
    position: absolute;
    left: 50%;
    bottom: calc(100% + 11px);
    transform: translate(-50%, 4px);
    padding: 6px 9px;
    background: #252525;
    color: #ddd;
    border: 1px solid #383838;
    border-radius: 5px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: .18s;
}

.tooltip:hover::after {
    opacity: 1;
    transform: translate(-50%, 0);
}

@media (prefers-reduced-motion: reduce) {
    .cube {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="background" aria-hidden="true">
    <canvas id="shader"></canvas>
</div>

<main class="profile">

    <div class="cube-wrap">
        <div class="cube" aria-label="Spinning profile cube">
            <div class="face front">
                <img src="profile.png" alt="Profile picture">
            </div>

            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

    <h1>chez</h1>

    <p class="bio">
        hi im chez i make stuff<br>
        ex roblox developer<br>
        owner of crit
    </p>

    <nav class="links" aria-label="Social links">
        <a
            class="tooltip"
            href="https://discord.com"
            target="_blank"
            rel="noopener noreferrer"
            data-tip="im.chez"
        >
            <span>discord</span>
        </a>

        <a
            href="https://namemc.com/profile/chezd"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span>minecraft</span>
        </a>
    </nav>

</main>

<script>
(() => {
    const canvas = document.getElementById('shader');
    const ctx = canvas.getContext('2d', { alpha: false });

    let w = 0;
    let h = 0;
    let frame;
    let pixels;

    const scale = 4;

    const hash = (x, y) => {
        const v = Math.sin(
            x * 127.1 + y * 311.7 + 41.73
        ) * 43758.5453;

        return v - Math.floor(v);
    };

    const smooth = v => v * v * (3 - 2 * v);

    function noise(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);

        const fx = smooth(x - ix);
        const fy = smooth(y - iy);

        const a = hash(ix, iy);
        const b = hash(ix + 1, iy);
        const c = hash(ix, iy + 1);
        const d = hash(ix + 1, iy + 1);

        return (
            (a + (b - a) * fx) * (1 - fy) +
            (c + (d - c) * fx) * fy
        );
    }

    function resize() {
        w = Math.max(1, Math.ceil(innerWidth / scale));
        h = Math.max(1, Math.ceil(innerHeight / scale));

        canvas.width = w;
        canvas.height = h;

        frame = ctx.createImageData(w, h);
        pixels = frame.data;
    }

    function draw(ms) {
        const t = ms * 0.00022;

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {

                const u = x / w;
                const v = y / h;

                // Animated domain warping creates flowing shapes.
                const warp1 = noise(
                    u * 3.2 + t * 0.8,
                    v * 3.2 - t * 0.55
                );

                const warp2 = noise(
                    u * 3.2 - t * 0.6 + 8,
                    v * 3.2 + t * 0.75
                );

                const px = u * 4.1 + (warp1 - .5) * 2.4;
                const py = v * 4.1 + (warp2 - .5) * 2.4;

                const clouds = noise(
                    px + t * 0.65,
                    py - t * 0.45
                );

                const detail = noise(
                    px * 2.1 - t * 0.35,
                    py * 2.1 + t * 0.4
                );

                const flow = Math.sin(
                    (
                        px * 1.25 +
                        py * .9 +
                        clouds * 2.2
                    ) * Math.PI + t * 1.8
                );

                const field =
                    clouds * .58 +
                    detail * .2 +
                    (flow * .5 + .5) * .22;

                const shade =
                    12 + Math.pow(Math.max(0, field), 1.8) * 31;

                const i = (y * w + x) * 4;

                pixels[i] = shade;
                pixels[i + 1] = shade;
                pixels[i + 2] = shade;
                pixels[i + 3] = 255;
            }
        }

        ctx.putImageData(frame, 0, 0);

        requestAnimationFrame(draw);
    }

    addEventListener('resize', resize, { passive: true });

    resize();
    requestAnimationFrame(draw);
})();
</script>

</body>
</html>
