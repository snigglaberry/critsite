
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chez</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
}

.profile {
    text-align: center;
}

/* 3D CUBE */

.cube-container {
    width: 130px;
    height: 130px;
    margin: 0 auto 55px;
    perspective: 700px;
}

.cube {
    width: 130px;
    height: 130px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-22deg) rotateY(35deg);
}

.face {
    position: absolute;
    inset: -0.5px;
    width: 131px;
    height: 131px;
    background: #fee25d;
    backface-visibility: visible;
}

/* FRONT - PROFILE */

.front {
    transform: translateZ(65.5px);
    background-image: url("https://github.com/snigglaberry/critsite/blob/main/chez/chezface.png?raw=true");
    background-size: cover;
    background-position: center;
}

/* BACK */

.back {
    transform: rotateY(180deg) translateZ(65.5px);
    background: #fee25d;
}

/* RIGHT */

.right {
    transform: rotateY(90deg) translateZ(65.5px);
    background: #d9bd4e;
}

/* LEFT */

.left {
    transform: rotateY(-90deg) translateZ(65.5px);
    background: #e5cc55;
}

/* TOP */

.top {
    transform: rotateX(90deg) translateZ(65.5px);
    background: #fee25d;
}

/* BOTTOM */

.bottom {
    transform: rotateX(-90deg) translateZ(65.5px);
    background: #bba23f;
}

/* TEXT */

h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 12px;
}

.bio {
    color: #888;
    font-size: 14px;
    line-height: 1.8;
}

/* LINKS */

.links {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 25px;
}

.links a {
    color: #888;
    text-decoration: none;
    font-size: 13px;
    transition: color 0.2s;
}

.links a:hover {
    color: white;
}

/* DISCORD TOOLTIP */

.discord {
    position: relative;
}

.discord::after {
    content: "im.chez";
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: white;
    padding: 5px 9px;
    border-radius: 4px;
    font-size: 11px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    white-space: nowrap;
}

.discord:hover::after {
    opacity: 1;
}

/* MOBILE */

@media (max-width: 400px) {
    .cube-container {
        margin-bottom: 45px;
    }
}
</style>
</head>

<body>

<main class="profile">

    <div class="cube-container">
        <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

    <h1>chez</h1>

    <p class="bio">
        hi im chez i make stuff<br>
        ex roblox developer<br>
        owner of crit
    </p>

    <nav class="links">
        <a href="https://discord.com" class="discord" target="_blank" rel="noopener noreferrer">discord</a>
        <a href="https://namemc.com/profile/chezd" target="_blank" rel="noopener noreferrer">minecraft</a>
    </nav>

</main>

</body>
</html>
