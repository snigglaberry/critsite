
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050d12">
<title>fmxw</title>

<style>
@font-face {
    font-family: Minecraft;
    src: url("../assets/minecraft.ttf") format("truetype");
    font-display: swap;
}

:root {
    --bg: #050d12;
    --accent: #22d3ee;
    --light: #a5f3fc;
    --text: #e6fbff;
    --muted: #82b9c8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    isolation: isolate;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    z-index: -3;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 45%,
            #123e50 0%,
            #0a202d 40%,
            #050d12 80%
        );
}

.background::before {
    content: "";
    position: absolute;
    inset: -50%;
    background: conic-gradient(
        from 0deg at 50% 50%,
        transparent,
        rgba(45,212,230,.22),
        transparent,
        rgba(56,189,248,.2),
        transparent
    );
    filter: blur(90px);
    animation: atmosphere 25s linear infinite;
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .18;
    background-image:
        linear-gradient(rgba(103,232,249,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(103,232,249,.08) 1px, transparent 1px);
    background-size: 65px 65px;
    mask-image: radial-gradient(ellipse at center, black, transparent 85%);
}

@keyframes atmosphere {
    to { transform: rotate(360deg); }
}

/* PARTICLES */

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    pointer-events: none;
}

/* MOUSE LIGHT */

.ambient {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(34,211,238,.13);
    filter: blur(120px);
    pointer-events: none;
    z-index: -1;
    transform: translate(-50%, -50%);
    left: 50%;
    top: 45%;
    transition: left .3s ease, top .3s ease;
}

/* MAIN PROFILE */

main {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: appear 1.2s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
        filter: blur(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

/* PROFILE IMAGE */

.avatar {
    width: 250px;
    height: 250px;
    object-fit: contain;
    display: block;
    margin-bottom: 30px;
    filter:
        drop-shadow(0 0 15px rgba(34,211,238,.3))
        drop-shadow(0 0 40px rgba(8,145,178,.2));
    transition: transform .4s ease, filter .4s ease;
}

.avatar:hover {
    transform: scale(1.06);
    filter:
        drop-shadow(0 0 20px rgba(103,232,249,.6))
        drop-shadow(0 0 55px rgba(8,145,178,.4));
}

/* NAME */

.name {
    font-family: Minecraft, monospace;
    font-size: clamp(42px, 8vw, 68px);
    font-weight: normal;
    letter-spacing: 2px;
    color: #e6fbff;
    line-height: 1.4;
    text-shadow:
        0 0 8px #67e8f9,
        0 0 22px rgba(34,211,238,.8),
        0 0 50px rgba(8,145,178,.65),
        0 0 90px rgba(8,145,178,.4);
    animation: nameGlow 4s ease-in-out infinite alternate;
}

@keyframes nameGlow {
    from {
        text-shadow:
            0 0 8px rgba(103,232,249,.6),
            0 0 20px rgba(34,211,238,.4),
            0 0 45px rgba(8,145,178,.3);
    }
    to {
        text-shadow:
            0 0 12px #cffafe,
            0 0 30px #67e8f9,
            0 0 65px rgba(8,145,178,.8);
    }
}

/* BIO */

.bio {
    margin-top: 15px;
    color: #9eeaf5;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 2.5px;
    text-transform: uppercase;
}

/* SOCIAL LINKS */

.socials {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 32px;
}

.social-link {
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    color: #9eeaf5;
    text-decoration: none;
    border: 1px solid rgba(103,232,249,.16);
    background: rgba(34,211,238,.07);
    border-radius: 14px;
    transition: all .25s ease;
}

.social-link svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
}

.social-link:hover {
    color: white;
    background: rgba(34,211,238,.2);
    border-color: rgba(103,232,249,.7);
    transform: translateY(-5px);
    box-shadow: 0 8px 35px rgba(8,145,178,.25);
}

.social-link:focus-visible {
    outline: 2px solid var(--light);
    outline-offset: 4px;
}

/* FOOTER */

.bottom {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 3px;
    color: #397f91;
    text-transform: uppercase;
    pointer-events: none;
}

/* MOBILE */

@media (max-width: 600px) {
    .avatar {
        width: 200px;
        height: 200px;
    }

    .name {
        font-size: clamp(34px, 11vw, 52px);
    }

    .bio {
        font-size: 11px;
        letter-spacing: 2px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<canvas id="particles"></canvas>
<div class="ambient" id="ambient"></div>

<main>
    <section class="profile">

        <img
            class="avatar"
            src="fmxw/fmxwprofile.png"
            alt="fmxw profile picture"
        >

        <h1 class="name">fmxw</h1>

        <p class="bio">Social manager of Crit</p>

        <nav class="socials" aria-label="Social links">

            <!-- TIKTOK -->
            <a
                class="social-link"
                href="https://www.tiktok.com/@crit.launcher"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="TikTok"
                title="TikTok"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.58v13.67a2.9 2.9 0 0 1-2.9 2.9 2.9 2.9 0 0 1-2.9-2.9 2.9 2.9 0 0 1 2.9-2.9c.3 0 .6.05.88.14V9.27a6.5 6.5 0 0 0-.88-.06 6.48 6.48 0 1 0 6.48 6.48V8.7a8.3 8.3 0 0 0 4.86 1.56V6.69h-1.09Z"/>
                </svg>
            </a>

            <!-- GITHUB -->
            <a
                class="social-link"
                href="https://github.com/fmxw"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub"
                title="GitHub"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.7 1.15 1.7 1.15.99 1.7 2.6 1.21 3.23.92.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.08 1.14a10.7 10.7 0 0 1 5.61 0c2.14-1.44 3.08-1.14 3.08-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.77 1.15 2.99 0 4.29-2.62 5.24-5.11 5.51.4.35.75 1.03.75 2.08v3.08c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8Z"/>
                </svg>
            </a>

        </nav>

    </section>
</main>

<div class="bottom">FMXW · CRIT</div>

<script>
/* MOUSE FOLLOWING LIGHT */

const ambient = document.getElementById("ambient");

window.addEventListener("mousemove", e => {
    ambient.style.left = e.clientX + "px";
    ambient.style.top = e.clientY + "px";
});

/* PARTICLE BACKGROUND */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let width, height, particles = [];

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createParticles();
}

function createParticles() {
    const count = Math.min(
        Math.floor(width * height / 11000),
        110
    );

    particles = Array.from({length: count}, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.6 + .3,
        speed: Math.random() * .35 + .08,
        opacity: Math.random() * .5 + .12,
        phase: Math.random() * Math.PI * 2
    }));
}

function draw() {
    ctx.clearRect(0, 0, width, height);

    const reduced = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;

    particles.forEach(p => {
        if (!reduced) {
            p.y -= p.speed;
            p.phase += .012;
        }

        if (p.y < -5) {
            p.y = height + 5;
            p.x = Math.random() * width;
        }

        const opacity = p.opacity *
            (.65 + Math.sin(p.phase) * .35);

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(103,232,249,${opacity})`;
        ctx.fill();
    });

    if (!reduced) {
        requestAnimationFrame(draw);
    }
}

window.addEventListener("resize", resize);

resize();
draw();
</script>

</body>
</html>
